server {
    listen 80;
    
    # Where the static files are stored
    root /usr/share/nginx/html;
    index index.html;

    # Serve files directly if they exist, otherwise fallback to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: ensure static assets (js, css, images) return 404 instead of index.html if missing
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
